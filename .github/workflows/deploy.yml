name: Deploy

# Manual only, deliberately. There is no push trigger: a deploy runs `bun run db:setup` as its
# release command (see fly.toml), so it touches the target's datastore and should be an explicit
# act rather than a side effect of merging.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which deployment to update
        type: choice
        default: production
        options:
          - production
          - conformance

permissions:
  contents: read

concurrency:
  # Per target, because the two deployments share no Fly app and no database: a conformance deploy
  # has no reason to queue behind production's, and serialising them would only make a certification
  # run wait on an unrelated release.
  group: fly-deploy-${{ inputs.target }}
  # Never cancel a deploy in flight — the release command may be mid-provisioning.
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # No coverage upload here — that is ci.yml's job. This run exists only to gate the deploy, and
      # it cannot reach the deployment it is gating: no connection string is set, so the suite runs
      # on the in-memory adapter by construction rather than by convention.
      - run: bun test

  deploy:
    name: Deploy ${{ inputs.target }} to Fly
    needs: test
    runs-on: ubuntu-latest
    # One GitHub environment per target, so required reviewers or a wait timer can be demanded of
    # production without also slowing down a test bed.
    environment: ${{ inputs.target }}
    env:
      # The whole difference between the two deployments is which file describes it; app name,
      # issuer, database and machine policy all follow from that one choice.
      CONFIG: ${{ inputs.target == 'production' && 'fly.toml' || 'fly.conformance.toml' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # --remote-only builds on Fly's builder, so the runner needs no Docker daemon.
      # The config's release_command runs db:setup and db:migrate on a temporary Machine first and
      # aborts the deploy on a non-zero exit, which is what db:setup returns when a declared storage
      # constraint is not in force.
      - name: Deploy
        run: flyctl deploy --remote-only -c "$CONFIG"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Fly's own checks prove the probes answer. This proves the deployment is the one the config
      # describes, which is a different question: ISSUER is baked into the seeded console client's
      # redirect_uri via `$setOnInsert`, so a deployment advertising an issuer nobody expects breaks
      # admin login and re-running db:setup does not repair it. Reading the expected value out of the
      # config rather than restating it here is what stops this check from agreeing with itself.
      - name: Smoke check
        run: |
          ISSUER=$(grep -m1 "^  ISSUER = " "$CONFIG" | cut -d"'" -f2)
          echo "config: $CONFIG"
          echo "expecting issuer: $ISSUER"
          # Retries cover a cold start: the conformance instance stops when idle, so the first
          # request wakes a Machine.
          curl -fsS --retry 5 --retry-delay 5 --retry-connrefused "$ISSUER/health"
          echo
          # Readiness reaches the datastore, so this is the step that fails when a connection string
          # points somewhere that is no longer there.
          curl -fsS --retry 3 --retry-delay 5 "$ISSUER/ready"
          echo
          ADVERTISED=$(curl -fsS --retry 3 --retry-delay 5 \
            "$ISSUER/.well-known/openid-configuration" \
            | grep -o '"issuer":"[^"]*"' | cut -d'"' -f4)
          if [ "$ADVERTISED" != "$ISSUER" ]; then
            echo "advertised issuer is '$ADVERTISED', expected '$ISSUER'" >&2
            exit 1
          fi
          echo "issuer matches: $ADVERTISED"
