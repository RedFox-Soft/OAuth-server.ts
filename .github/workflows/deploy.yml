name: Deploy

# Manual only, deliberately. There is no push trigger: a deploy runs `bun run db:setup` as its
# release command (see fly.toml), so it touches the production datastore and should be an explicit
# act rather than a side effect of merging.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  # Never cancel a deploy in flight — the release command may be mid-provisioning.
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # No coverage upload here — that is ci.yml's job. This run exists only to gate the deploy.
      - run: bun test

  deploy:
    name: Deploy to Fly
    needs: test
    runs-on: ubuntu-latest
    # Attach the repo's `production` environment so required reviewers, wait timers or
    # environment-scoped secrets can be added later without touching this file.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only builds on Fly's builder, so the runner needs no Docker daemon.
      # fly.toml's release_command runs bun run db:setup on a temporary Machine first and aborts
      # the deploy on a non-zero exit, which is what db:setup returns when a declared storage
      # constraint is not in force.
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Fly's own health check only proves /health answers. This additionally proves the OIDC
      # surface is served and prints the advertised issuer, which is the one value a deploy can get
      # wrong in a way nothing else catches: ISSUER is baked into the seeded admin client's
      # redirect_uri via $setOnInsert, so a mismatch breaks admin login and re-running db:setup
      # does not repair it.
      - name: Smoke check
        run: |
          APP=$(grep -m1 '^app' fly.toml | cut -d"'" -f2)
          echo "app: $APP"
          # Retries cover a cold start: min_machines_running = 0, so the first request wakes a Machine.
          curl -fsS --retry 5 --retry-delay 5 --retry-connrefused \
            "https://$APP.fly.dev/health"
          echo
          curl -fsS --retry 3 --retry-delay 5 \
            "https://$APP.fly.dev/.well-known/openid-configuration" \
            | grep -o '"issuer":"[^"]*"'
