name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Dependabot and fork pull requests run without the repository's Actions secrets, so the Codecov
    # token is empty there and the upload is rejected before it starts. Mapping the secret to a
    # job-level variable is what makes it testable at all: the `secrets` context is not available in
    # a step `if`, but `env` is.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The lint is type-aware and covers website/, whose types come from its own node_modules and from
      # what `astro sync` generates; without them every Astro and Playwright value is an error type.
      # Only the docs export is needed for that, not the screenshot capture `bun run generate` also runs.
      - name: Prepare the site's types for the lint
        run: |
          (cd website && bun install --frozen-lockfile)
          bun scripts/docs_export.ts website/generated/docs-export.json
          (cd website && bunx astro sync)

      # Without --fix: CI reports what is wrong rather than repairing a tree it then throws away. It
      # ran nowhere before this step, and 250 errors accumulated unseen.
      - name: Lint
        run: bunx eslint .

      # `bun test` strips types without checking them, so a type error reaches main unless this runs.
      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        run: bunx prettier --check .

      - name: Run tests with coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage report to Codecov
        # Skipped rather than failed when there is no token to upload with, so a dependency bump is
        # judged on its tests. Coverage is still recorded on every push to main, where the secret is.
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          slug: RedFox-Soft/OAuth-server.ts
          files: coverage/lcov.info
          fail_ci_if_error: true
