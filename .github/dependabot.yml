# Keeps the three things the Security workflow scans from going stale between scans: the two Bun
# lockfiles and the actions the workflows themselves run. Security updates for known advisories are
# separate and already enabled in the repository settings; this is the routine cadence.
version: 2
updates:
  - package-ecosystem: bun
    directories:
      - '/'
      - '/website'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One pull request per lockfile for routine bumps; an advisory still gets its own.
    groups:
      dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday

  # The base image, which is the other half of pinning it by digest: a pin nobody moves is a pin to a
  # stale image, and the image scan reports against whatever it holds. Only works because the Dockerfile
  # names a versioned tag — see the comment there for why the floating `alpine` tag could not be pinned.
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
