name: Release

# A version tag is the release act. Pushing `vX.Y.Z` runs the suite, publishes the container image
# under that version, and creates the GitHub release the website reads: its body is the CHANGELOG
# section for the version and its assets are the documentation export and the CHANGELOG itself.
#
# Deliberately separate from deploy.yml: publishing an image and release notes touches nothing in
# production. Deploying stays a manual act.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/redfox-soft/oauth-server-ts

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test

  image:
    name: Publish image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match package.json ${version}"; exit 1; }

      - name: Export the documentation tables
        run: bun run docs:export dist/docs-export.json

      - name: Extract this version's changelog section
        run: |
          mkdir -p dist
          bun scripts/changelog_section.ts "${GITHUB_REF_NAME}" CHANGELOG.md > dist/release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/docs-export.json
            CHANGELOG.md
